name: CI

on:
  push:
  pull_request:

env:
  FOUNDRY_PROFILE: ci

jobs:
  ci:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3

      - name: 1. forge fmt --check
        run: forge fmt --check

      - name: 2. forge build --sizes (fails over 24576 bytes)
        run: forge build --sizes

      # The backend handover is generated from the ABI; this fails if the contract changed and
      # handover/ was not regenerated (python handover/build.py).
      - name: 2b. handover matches the compiled contract
        run: python3 ../handover/build.py --check

      - name: 3. forge test
        run: forge test -vvv

      - name: 4. invariant suite, skipped until test/invariant/ exists
        if: hashFiles('contracts/test/invariant/**') != ''
        run: forge test -vvv --match-path "test/invariant/*"

      - name: 5. coverage, 100% lines and branches on src
        env:
          FOUNDRY_PROFILE: default
        run: |
          forge coverage --report lcov --no-match-coverage '(test|script)/'
          awk -F: '
            /^SF:/  { src = ($2 ~ /^src\//) }
            src && /^LF:/  { lf += $2 }  src && /^LH:/  { lh += $2 }
            src && /^BRF:/ { bf += $2 }  src && /^BRH:/ { bh += $2 }
            END {
              printf "src coverage: lines %d/%d, branches %d/%d\n", lh, lf, bh, bf
              exit (lf == 0 || lh < lf || bh < bf)
            }' lcov.info

      # .gas-snapshot is regenerated with the same profile and filter, nothing else:
      #   FOUNDRY_PROFILE=default forge snapshot --no-match-test 'testFuzz|invariant|test_fork'
      # Fuzz and invariant tests are excluded (their gas and revert counts vary with the random
      # inputs), and so are fork tests, which skip on CI where no RPC URL is set.
      - name: 6. gas snapshot, fails on a regression over 10%
        env:
          FOUNDRY_PROFILE: default
        run: forge snapshot --check --tolerance 10 --no-match-test 'testFuzz|invariant|test_fork'

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Also fails if Slither could not analyse part of the code: it exits 0 on an IR error or a
      # crash inside a detector, so the output is checked too (D-35).
      - name: 7. slither on src/ only, fails on medium or on any part left unanalysed
        run: |
          pip install slither-analyzer==0.11.6
          slither . --fail-medium --filter-paths "(lib|test|script)/" 2>&1 | tee slither.log
          if grep -nE 'Impossible to generate IR|Traceback \(most recent call last\)' slither.log; then
            echo "::error::Slither could not analyse part of src/; see the lines above"
            exit 1
          fi

      # A second analyser (TS 5, P2.5). Aderyn ships no Windows build, so it runs here only:
      # the official Linux release, pinned and checked against its published SHA-256. The full
      # report goes to the job summary. Aderyn always exits 0, so the step fails by itself on
      # any high-severity finding; low ones are triaged in writing (DECISION.md).
      - name: 7b. aderyn on src/, pinned v0.6.8, fails on a high-severity finding
        run: |
          curl -sSfL -o aderyn.tar.xz https://github.com/Cyfrin/aderyn/releases/download/aderyn-v0.6.8/aderyn-x86_64-unknown-linux-gnu.tar.xz
          echo "ffd6ca658962e211a3ac821c646f69c8e14bf1b1001cbfe091bcd4535a691e46  aderyn.tar.xz" | sha256sum -c -
          mkdir aderyn-bin && tar -xJf aderyn.tar.xz -C aderyn-bin
          bin=$(find aderyn-bin -type f -name aderyn | head -1)
          "$bin" . --src src --skip-update-check -o aderyn.md
          "$bin" . --src src --skip-update-check -o aderyn.json
          cat aderyn.md >> "$GITHUB_STEP_SUMMARY"
          highs=$(jq '.issue_count.high' aderyn.json)
          lows=$(jq '.issue_count.low' aderyn.json)
          echo "aderyn: $highs high, $lows low"
          jq -r '(.high_issues.issues[] | "HIGH " + .detector_name + ": " + .title, (.instances[] | "     " + .contract_path + ":" + (.line_no | tostring))), (.low_issues.issues[] | "low  " + .detector_name + ": " + .title, (.instances[] | "     " + .contract_path + ":" + (.line_no | tostring)))' aderyn.json
          # Highs triaged in writing (D-67) are listed, by detector, file and line, in
          # .github/aderyn-allowed-highs.txt. Any other high fails, and a listed one that moves
          # stops matching and fails too, so it is reviewed again.
          jq -r '.high_issues.issues[] | .detector_name as $d | .instances[] | $d + " " + .contract_path + ":" + (.line_no | tostring)' aderyn.json | sort > aderyn-highs.txt
          new=$(comm -23 aderyn-highs.txt <(grep -v '^#' ../.github/aderyn-allowed-highs.txt | sort))
          if [ -n "$new" ]; then
            echo "::error::Aderyn high-severity finding(s) not triaged in D-67; the report is in the job summary:"
            echo "$new"
            exit 1
          fi

      - name: 8. backend typecheck, lint, unit, integration, chain integration
        if: false
        run: echo "backend lands in phase 3"

      - name: 9. reconciliation test
        if: false
        run: echo "reconciliation lands in phase 4"
