name: CI

on:
  push:
  pull_request:

env:
  FOUNDRY_PROFILE: ci

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3

      - name: Phase 0 only, drop test files that need src/IndicoLedger.sol until it exists
        if: hashFiles('contracts/src/IndicoLedger.sol') == ''
        run: rm test/unit/Smoke.t.sol test/helpers/Fixture.sol test/helpers/Actors.sol test/helpers/StateSnapshot.sol

      - name: 1. forge fmt --check
        run: forge fmt --check

      - name: 2. forge build --sizes (fails over 24576 bytes)
        run: forge build --sizes

      - name: 3. forge test
        run: forge test -vvv

      - name: 4. invariant suite, skipped until test/invariant/ exists
        if: hashFiles('contracts/test/invariant/**') != ''
        run: forge test -vvv --match-path "test/invariant/*"

      - name: 5. coverage, 100% lines and branches on src
        env:
          FOUNDRY_PROFILE: default
        run: |
          forge coverage --report lcov --no-match-coverage '(test|script)/'
          awk -F: '
            /^SF:/  { src = ($2 ~ /^src\//) }
            src && /^LF:/  { lf += $2 }  src && /^LH:/  { lh += $2 }
            src && /^BRF:/ { bf += $2 }  src && /^BRH:/ { bh += $2 }
            END {
              printf "src coverage: lines %d/%d, branches %d/%d\n", lh, lf, bh, bf
              exit (lf == 0 || lh < lf || bh < bf)
            }' lcov.info

      # .gas-snapshot is regenerated with the same profile and filter, nothing else:
      #   FOUNDRY_PROFILE=default forge snapshot --no-match-test testFuzz
      # Fuzz tests are excluded because their gas varies with the random inputs.
      - name: 6. gas snapshot, fails on a regression over 10%
        env:
          FOUNDRY_PROFILE: default
        run: forge snapshot --check --tolerance 10 --no-match-test testFuzz

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 7. slither on src/ only, fails on medium
        run: |
          pip install slither-analyzer==0.11.6
          slither . --fail-medium --filter-paths "(lib|test|script)/"

      - name: 8. backend typecheck, lint, unit, integration, chain integration
        if: false
        run: echo "backend lands in phase 3"

      - name: 9. reconciliation test
        if: false
        run: echo "reconciliation lands in phase 4"
