name: Deep fuzz

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  deep:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: forge test --profile deep (5,000,000 fuzz runs)
        run: forge test --profile deep
