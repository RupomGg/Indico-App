name: Deep fuzz

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  # Skips the nightly run when nothing under contracts/ (or this workflow) changed since the last
  # green run, and stays red without re-running when nothing changed since a red one (D-31).
  # A manual dispatch always runs.
  check:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.decide.outputs.run }}
      files: ${{ steps.shards.outputs.files }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Last green: the newest successful run on any branch whose deep shards all ran and all
          # passed, matched to this checkout by commit (deep-last-green.sh). A D-31 skip is not one.
          api="repos/${{ github.repository }}/actions"
          jobs_q='[.jobs[] | select(.name | startswith("deep")) | .conclusion] | join(",")'
          green=$(gh api "$api/workflows/deep.yml/runs?status=success&per_page=30" -q '.workflow_runs[] | "\(.id) \(.head_sha)"' |
            while read -r id sha; do
              echo "$sha $(gh api "$api/runs/$id/jobs?per_page=100" -q "$jobs_q")"
            done | bash .github/scripts/deep-last-green.sh)
          runs="$api/workflows/deep.yml/runs?branch=main&per_page=1"
          read -r last last_conclusion <<< "$(gh api "$runs&status=completed" -q '.workflow_runs[0] | "\(.head_sha) \(.conclusion)"')"
          bash .github/scripts/deep-should-run.sh "${{ github.event_name }}" "$green" "${last:-}" "${last_conclusion:-}" >> "$GITHUB_OUTPUT"

      # One deep shard per test file, so no single job holds the whole suite against the
      # 360-minute limit. Built from the files on disk, so a new test file is never left out.
      # Invariant files run as two shards with different seeds, "<file>@1" and "<file>@2", each
      # 5,000 runs at depth 256 (foundry.toml deep profile): 10,000 runs in all, depth unchanged.
      - id: shards
        working-directory: contracts
        run: |
          {
            find test -name '*.t.sol' -not -path 'test/invariant/*'
            for seed in 1 2; do find test/invariant -name '*.t.sol' | sed "s/$/@$seed/"; done
          } | sort > shards.txt
          echo "files=$(jq -R . < shards.txt | jq -cs .)" >> "$GITHUB_OUTPUT"

      - name: deep-runs-guard self-check
        run: bash .github/scripts/deep-runs-guard.test.sh

  deep:
    needs: check
    if: needs.check.outputs.run == 'true'
    name: deep (${{ matrix.file }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.check.outputs.files) }}
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3

      - name: forge test --profile deep (5,000,000 fuzz runs), this file only
        shell: bash
        env:
          ENTRY: ${{ matrix.file }}
        run: |
          path="${ENTRY%@*}"
          if [ "$path" != "$ENTRY" ]; then seed=(--fuzz-seed "${ENTRY#*@}"); else seed=(); fi
          forge test --profile deep --match-path "$path" "${seed[@]}" 2>&1 | tee deep.log

      # Fails the shard if any fuzz test ran fewer than the deep profile's runs (O-036), or, on an
      # invariant shard, if the campaign ran under 5,000 runs or under runs x 256 calls (P2.1).
      - name: every fuzz test ran 5,000,000 times, every invariant campaign in full
        shell: bash
        env:
          ENTRY: ${{ matrix.file }}
        run: |
          if [ "${ENTRY%@*}" != "$ENTRY" ]; then inv=(5000 256); else inv=(); fi
          bash ../.github/scripts/deep-runs-guard.sh deep.log 5000000 "${inv[@]}"
