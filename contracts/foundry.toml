[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true

[profile.default.fuzz]
runs = 10_000

[profile.ci.fuzz]
runs = 100_000

[profile.deep.fuzz]
runs = 5_000_000

[invariant]
runs = 256
depth = 128
fail_on_revert = false

[profile.deep.invariant]
runs = 10_000
depth = 256

[fmt]
line_length = 100
